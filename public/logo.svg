<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LuminaFlow logo">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- Trending up chart line - represents financial runway growth -->
  <path d="M12 46 L26 32 L37 40 L52 18"
        fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head at peak -->
  <polyline points="44,14 52,18 48,26"
            fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Start dot -->
  <circle cx="12" cy="46" r="2.5" fill="#10B981"/>
  <!-- Mid pivot dot (warning color - inflection point) -->
  <circle cx="37" cy="40" r="2.5" fill="#F59E0B"/>
  <!-- End dot (peak / goal achieved) -->
  <circle cx="52" cy="18" r="3" fill="#10B981"/>
</svg>
