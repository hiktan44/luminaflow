<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LuminaFlow — Freelancerlar için Akıllı Nakit Akışı">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#0F172A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1E293B" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#1E293B" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1E293B" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#1E293B" stroke-width="1"/>

  <!-- Background chart area fill (glow) -->
  <polygon points="620,420 720,340 820,380 920,260 1020,200 1120,120 1120,500 620,500"
           fill="url(#glowGrad)"/>

  <!-- Background decorative chart line -->
  <polyline points="620,420 720,340 820,380 920,260 1020,200 1120,120"
            fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>

  <!-- Logo background -->
  <rect x="80" y="200" width="110" height="110" rx="24" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Logo icon (scaled up, centered in 80,200 to 190,310 box — center 135,255) -->
  <!-- Trending up chart line scaled to fit -->
  <path d="M95 285 L115 265 L127 273 L165 245"
        fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="155,241 165,245 161,255"
            fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="95" cy="285" r="4" fill="#10B981"/>
  <circle cx="127" cy="273" r="4" fill="#F59E0B"/>
  <circle cx="165" cy="245" r="5" fill="#10B981"/>

  <!-- App name -->
  <text x="80" y="380" font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2" fill="#F8FAFC">Lumina</text>
  <text x="374" y="380" font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="72" font-weight="300" letter-spacing="-2" fill="#10B981">Flow</text>

  <!-- Tagline -->
  <text x="80" y="430" font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="26" font-weight="400" fill="#64748B" letter-spacing="0">
    Freelancerlar için akıllı nakit akışı ve dinamik vergi rezervi yönetimi.
  </text>

  <!-- Divider -->
  <line x1="80" y1="468" x2="520" y2="468" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Feature pills -->
  <!-- Safe-to-Spend -->
  <rect x="80" y="484" width="180" height="36" rx="18" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
  <text x="170" y="507" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#10B981" text-anchor="middle">Safe-to-Spend</text>

  <!-- Runway -->
  <rect x="272" y="484" width="140" height="36" rx="18" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
  <text x="342" y="507" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#10B981" text-anchor="middle">Runway Takibi</text>

  <!-- Vergi Rezervi -->
  <rect x="424" y="484" width="150" height="36" rx="18" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
  <text x="499" y="507" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#F59E0B" text-anchor="middle">Vergi Rezervi</text>

  <!-- Right side: big metric showcase -->
  <rect x="680" y="130" width="440" height="370" rx="20" fill="#1E293B" fill-opacity="0.6" stroke="#2D3E55" stroke-width="1"/>

  <!-- Metric: Runway -->
  <text x="900" y="205" font-family="Inter, 'SF Pro Display', sans-serif"
        font-size="15" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="1">FİNANSAL RUNWAY</text>
  <text x="900" y="270" font-family="Inter, 'SF Pro Display', sans-serif"
        font-size="58" font-weight="700" fill="#F8FAFC" text-anchor="middle">4 Ay 12 Gün</text>

  <!-- Divider inside card -->
  <line x1="720" y1="295" x2="1080" y2="295" stroke="#2D3E55" stroke-width="1"/>

  <!-- Safe-to-spend -->
  <text x="800" y="335" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">GÜVENLİ HARCAMA</text>
  <text x="800" y="375" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#10B981" text-anchor="middle">₺32.500</text>

  <!-- Vergi rezervi -->
  <text x="1000" y="335" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">VERGİ REZERVİ</text>
  <text x="1000" y="375" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#F59E0B" text-anchor="middle">₺17.500</text>

  <!-- Bottom divider -->
  <line x1="720" y1="405" x2="1080" y2="405" stroke="#2D3E55" stroke-width="1"/>

  <!-- CTA text in card -->
  <text x="900" y="455" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">luminaflow.app</text>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#10B981" fill-opacity="0.08"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
